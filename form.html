<!DOCTYPE html>
<html>
<head>
    <title>form</title>
</head>
<body>
    <form>
        <label>mother name</label>
        <input type="text" name="mother name" placeholder="ENTER A VALID COLOUR">
        <br><br>
        <label>date</label>
        <input type="date" name="date" placeholder="ENTER A VALID A DATE">
        <br><br>
        <label>colour</label>
        <input type="color" name="colour" placeholder="ENTER A VALID COLOUR" >
        <br><br>
        <label>datetime</label>
        <input type="datetime" name="datetime" placeholder="ENTER A VALID DATETIME">
        <br><br>
        <label>month</label>
        <input type="month" name="month" placeholder="ENTER A VALID MONTH">
        <br><br>
        <label>phone no</label>
        <input type="number" name="phone no" placeholder="ENTER A VALID NUMBER">
        <br><br>
        <label>hobbies dacing</label>
        <input type="checkbox" name="dacing" placeholder="dacing">
        <label>reading</label>
        <input type="checkbox" name="reading" placeholder="reading">
        <br><br>
        <label>email id</label>
        <input type="email" name="email id" placeholder="ENTER A VALID EMAIL">
        <br><br>
        <label>hidden</label>
        <input type="hidden" name="hidden" placeholder="">
        <br><br>
        <label>file</label>
        <input type="file" name="file" placeholder="ENTER A VALID FILE">
        <br><br>
        <label>image</label>
        <input type="image" name="image" placeholder="ENTER A VALID IMAGE">
        <br><br>
        <label>password</label>
        <input type="password" name="password" placeholder="ENTER A VALID PASSWORD">
        <br><br>
        <label>time</label>
        <input type="time" name="time" placeholder="ENTER A VALID TIME">
        <br><br>
    </form>
</body>
</html>
