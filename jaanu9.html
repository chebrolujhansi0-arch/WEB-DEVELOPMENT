<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <style>
        .box{
            padding: 20px;
            width: 300px;
            border: 3px solid;
            margin: 30px;
            background-color: bisque;
        }
        h1{
            padding: 10px;
       
        }
        h2{
            padding: 15px;

        }
        p{
            font-family:cursive;
            font-size: medium;
        }
    </style>
</head>
<body>
    <h1>MY WEB PAGE</h1>
    <div class="box">
        <h2>
        Css Box Model
    </h2>
        <p>This box contains padding,content,border and margin</p>
        
    </div>
    
</body>
</html>
